version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      dependencies: { patterns: ["*"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule: { interval: "weekly" }
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule: { interval: "weekly" }
