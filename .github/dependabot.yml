version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  groups:
    npm:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /desktop
  schedule:
    interval: weekly
  groups:
    npm:
      patterns:
      - '*'
- package-ecosystem: cargo
  directory: /desktop/src-tauri
  schedule:
    interval: weekly
  groups:
    cargo:
      patterns:
      - '*'
