name: Build

on:
  pull_request:
    branches: [main, master]
  # Reutilizado por docker.yml: cada push na main roda estes checks e so entao publica a imagem.
  workflow_call:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: radar_ci
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_RADAR_TEST_DSN: postgresql://postgres:radar_ci@127.0.0.1:5432/radar_test
      RELEASE_RADAR_SCREENSHOT_DIR: artifacts/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --group browser

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck, test and build the frontend
        run: npm run check
        working-directory: frontend

      - name: Ensure the committed app.js matches frontend/src/app.ts
        run: |
          if ! git diff --exit-code -- src/release_radar/static/app.js; then
            echo "::error file=src/release_radar/static/app.js::app.js is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

      - name: Install Chromium
        run: uv run --group browser playwright install --with-deps chromium

      - name: Test bot, database, HTTP API and frontend
        run: uv run --group browser pytest -q

      - name: Build distributable package
        run: uv build

      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-radar-ui-preview
          path: artifacts/frontend/
          if-no-files-found: warn
