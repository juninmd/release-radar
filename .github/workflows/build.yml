name: Build

on:
  pull_request:
    branches: [main, master]
  # Reutilizado por docker.yml: cada push na main roda estes checks e so entao publica a imagem.
  workflow_call:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: radar_ci
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_RADAR_TEST_DSN: postgresql://postgres:radar_ci@127.0.0.1:5432/radar_test
      RELEASE_RADAR_SCREENSHOT_DIR: artifacts/frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --group browser

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck, test and build the frontend
        run: npm run check
        working-directory: frontend

      - name: Ensure the committed app.js matches frontend/src/app.ts
        run: |
          if ! git diff --exit-code -- src/release_radar/static/app.js; then
            echo "::error file=src/release_radar/static/app.js::app.js is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

      - name: Install Chromium
        run: uv run --group browser playwright install --with-deps chromium

      - name: Test bot, database, HTTP API and frontend
        run: uv run --group browser pytest -q

      - name: Build distributable package
        run: uv build

      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-radar-ui-preview
          path: artifacts/frontend/
          if-no-files-found: warn
