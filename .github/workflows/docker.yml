name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/build.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
- uses: docker/build-push-action@v5
  with:
    context: .
    push: true
    tags: ${{ github.repository }}
