[project]
name = "release-radar"
version = "0.1.0"
description = "Radar de lancamentos de filmes, series, jogos e animes com analise de trailers e Telegram."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "psycopg2-binary>=2.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "rich>=13.9",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
release-radar = "release_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_radar"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Sem stubs de tipo publicados.
module = ["yt_dlp", "yt_dlp.*", "psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[dependency-groups]
browser = ["playwright==1.64.0"]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.15.15",
]
